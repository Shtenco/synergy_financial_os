name: V2.3 Fixed-200 CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'python/**'
      - '.github/workflows/v23-fixed200-ci.yml'
  push:
    branches:
      - evm-v23-balancer-fixed200

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Fixed-200 atomic tests
        run: forge test --match-contract Fixed200BalancerV2Test -vvv
      - name: Triangle math tests
        run: forge test --match-contract TriangleMathTest -vvv

  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: Fixed-200 order-flow simulation
        run: python python/simulate_v23_fixed200.py --cycles 5000 --seed 42 --scale 3500 --out /tmp/v23
      - name: No-edge falsification control
        run: python python/simulate_v23_fixed200.py --cycles 5000 --seed 42 --scale 0 --out /tmp/v23-noedge
      - name: Verify summaries
        run: |
          python - <<'PY'
          import json
          good=json.load(open('/tmp/v23/summary.json'))
          bad=json.load(open('/tmp/v23-noedge/summary.json'))
          assert good['flash_principal_per_executed_cycle'] == 200.0
          assert good['flash_fee_per_cycle'] == 0.0
          assert good['max_flash_debt_end'] == 0.0
          assert good['hard_tvl_gain'] > 0
          assert good['rubc_supply_delta'] == 0.0
          assert good['rubx_supply_delta'] == 0.0
          assert bad['executed'] == 0
          assert bad['hard_tvl_gain'] == 0.0
          print('V2.3 invariant checks PASS')
          PY
