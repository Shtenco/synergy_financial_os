name: V2.4 Reflexive Batch CI

on:
  pull_request:
    paths:
      - 'src/ReflexiveSingleBatchV24.sol'
      - 'src/SystemicNAVAccountingV24.sol'
      - 'python/simulate_v24_reflexive_batch.py'
      - 'V24_REFLEXIVE_BATCH.md'
      - '.github/workflows/v24-reflexive-ci.yml'
  push:
    branches:
      - evm-v24-reflexive-single-batch

jobs:
  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 100-dollar constant-depth batch
        run: python python/simulate_v24_reflexive_batch.py --quanta 100 --buyer 1 --flash 200 --band 0.10 --kernel-usdc 0.5 --out /tmp/v24
      - name: Run no-policy upper-bound comparison
        run: python python/simulate_v24_reflexive_batch.py --quanta 100 --buyer 1 --flash 200 --band 0.10 --kernel-usdc 0.5 --no-policy --out /tmp/v24-no-policy
      - name: Verify conservation and multiplier separation
        run: |
          python - <<'PY'
          import json
          s=json.load(open('/tmp/v24/summary.json'))
          u=json.load(open('/tmp/v24-no-policy/summary.json'))
          assert abs(s['hard_cash_end']-101.0) < 1e-8
          assert abs(s['reserve_vault_end']-100.0) < 1e-8
          assert abs(s['price_kernel_usdc_end']-1.0) < 1e-8
          assert s['flash_principal_usdc'] == 200.0
          assert s['cumulative_temp_lp_notional_usdc'] == 20000.0
          assert s['flash_debt_end'] == 0.0
          assert s['cash_conservation'] == 'PASS'
          assert s['hard_cash_multiplier_per_external_usdc'] == 1.0
          assert s['average_marked_multiplier_per_external_usdc'] > 20000.0
          assert s['rubc_supply_end'] <= 1000000.0
          assert s['rubx_supply_end'] <= 1000000.0
          assert u['average_marked_multiplier_per_external_usdc'] > 30000.0
          print('V2.4 reflexive batch invariants PASS')
          PY
