name: distribution-capacity-reservation-v1

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/distribution_capacity_reservation_v1.py'
      - 'sinergy_financial_os/distribution_capacity_reservation_contract_v1.py'
      - 'schemas/distribution_capacity_reservation_v1.schema.json'
      - 'schemas/distribution_commitment_state_v1.schema.json'
      - 'tests/test_distribution_capacity_reservation_v1.py'
      - 'tests/test_distribution_capacity_reservation_contract_v1.py'
      - 'config/schema_registry_v23.json'
      - 'docs/DISTRIBUTION_CAPACITY_RESERVATION_V1_20260821.md'
      - '.github/workflows/distribution-capacity-reservation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile reservation modules
        run: |
          python -m py_compile \
            sinergy_financial_os/distribution_capacity_reservation_v1.py \
            sinergy_financial_os/distribution_capacity_reservation_contract_v1.py
      - name: Run reservation regressions
        run: |
          pytest -q \
            tests/test_distribution_capacity_reservation_v1.py \
            tests/test_distribution_capacity_reservation_contract_v1.py
