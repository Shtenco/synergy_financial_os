name: distribution-execution-ticket-v1

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/distribution_execution_ticket_v1.py'
      - 'sinergy_financial_os/distribution_execution_ticket_contract_v1.py'
      - 'schemas/distribution_execution_ticket_v1.schema.json'
      - 'tests/test_distribution_execution_ticket_v1.py'
      - 'config/schema_registry_v19.json'
      - 'docs/DISTRIBUTION_EXECUTION_TICKET_V1_20260820.md'
      - '.github/workflows/distribution-execution-ticket-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile ticket modules
        run: |
          python -m py_compile \
            sinergy_financial_os/distribution_execution_ticket_v1.py \
            sinergy_financial_os/distribution_execution_ticket_contract_v1.py
      - name: Run execution-ticket regressions
        run: pytest -q tests/test_distribution_execution_ticket_v1.py
