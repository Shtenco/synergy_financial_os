name: valuation-policy-artifact-v1

on:
  push:
    paths:
      - 'sinergy_financial_os/valuation_policy_artifact_v1.py'
      - 'schemas/valuation_policy_artifact_v1.schema.json'
      - 'config/schema_registry_v14.json'
      - 'tests/test_valuation_policy_artifact_v1.py'
      - 'docs/VALUATION_POLICY_ARTIFACT_V1_20260819.md'
      - '.github/workflows/valuation-policy-artifact-v1.yml'
  pull_request:
    paths:
      - 'sinergy_financial_os/valuation_policy_artifact_v1.py'
      - 'schemas/valuation_policy_artifact_v1.schema.json'
      - 'config/schema_registry_v14.json'
      - 'tests/test_valuation_policy_artifact_v1.py'
      - 'docs/VALUATION_POLICY_ARTIFACT_V1_20260819.md'
      - '.github/workflows/valuation-policy-artifact-v1.yml'

concurrency:
  group: valuation-policy-artifact-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest jsonschema
      - name: Compile valuation artifact module
        run: python -m py_compile sinergy_financial_os/valuation_policy_artifact_v1.py
      - name: Run valuation artifact regressions
        run: pytest -q tests/test_valuation_policy_artifact_v1.py
