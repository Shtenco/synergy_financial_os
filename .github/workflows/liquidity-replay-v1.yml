name: liquidity-replay-v1

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/liquidity_resources_v1.py'
      - 'sinergy_financial_os/maturity_translation_v1.py'
      - 'sinergy_financial_os/liquidity_replay_v1.py'
      - 'sinergy_financial_os/liquidity_contract_v1.py'
      - 'schemas/liquidity_resources_v1.schema.json'
      - 'schemas/maturity_translation_v1.schema.json'
      - 'schemas/liquidity_replay_v1.schema.json'
      - 'tests/test_liquidity_replay_v1.py'
      - 'tests/test_liquidity_contract_v1.py'
      - 'config/schema_registry_v16.json'
      - 'docs/LIQUIDITY_REPLAY_V1_20260820.md'
      - '.github/workflows/liquidity-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile liquidity replay modules
        run: |
          python -m py_compile \
            sinergy_financial_os/liquidity_resources_v1.py \
            sinergy_financial_os/maturity_translation_v1.py \
            sinergy_financial_os/liquidity_replay_v1.py \
            sinergy_financial_os/liquidity_contract_v1.py
      - name: Run liquidity replay regressions
        run: |
          pytest -q \
            tests/test_liquidity_replay_v1.py \
            tests/test_liquidity_contract_v1.py
