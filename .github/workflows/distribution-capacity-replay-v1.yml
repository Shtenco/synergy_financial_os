name: distribution-capacity-replay-v1

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/liquidity_policy_v1.py'
      - 'sinergy_financial_os/distribution_capacity_replay_v1.py'
      - 'sinergy_financial_os/distribution_capacity_contract_v1.py'
      - 'schemas/liquidity_policy_v1.schema.json'
      - 'schemas/distribution_capacity_replay_v1.schema.json'
      - 'tests/test_distribution_capacity_replay_v1.py'
      - 'config/schema_registry_v17.json'
      - 'docs/DISTRIBUTION_CAPACITY_REPLAY_V1_20260820.md'
      - '.github/workflows/distribution-capacity-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile capacity modules
        run: |
          python -m py_compile \
            sinergy_financial_os/liquidity_policy_v1.py \
            sinergy_financial_os/distribution_capacity_replay_v1.py \
            sinergy_financial_os/distribution_capacity_contract_v1.py
      - name: Run distribution capacity regressions
        run: pytest -q tests/test_distribution_capacity_replay_v1.py
