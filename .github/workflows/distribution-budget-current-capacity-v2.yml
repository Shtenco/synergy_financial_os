name: distribution-budget-current-capacity-v2

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/distribution_budget_state_v1.py'
      - 'sinergy_financial_os/liquidity_current_resources_v1.py'
      - 'sinergy_financial_os/distribution_available_capacity_v2.py'
      - 'sinergy_financial_os/distribution_available_capacity_guard_v2.py'
      - 'sinergy_financial_os/distribution_budget_current_capacity_contract_v2.py'
      - 'schemas/distribution_budget_state_v1.schema.json'
      - 'schemas/liquidity_current_resources_v1.schema.json'
      - 'schemas/distribution_available_capacity_v2.schema.json'
      - 'tests/test_distribution_budget_current_capacity_v2.py'
      - 'tests/test_distribution_budget_current_capacity_contract_v2.py'
      - 'config/schema_registry_v22.json'
      - 'docs/DISTRIBUTION_BUDGET_CURRENT_CAPACITY_V2_20260821.md'
      - '.github/workflows/distribution-budget-current-capacity-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile budget and current-capacity modules
        run: |
          python -m py_compile \
            sinergy_financial_os/distribution_budget_state_v1.py \
            sinergy_financial_os/liquidity_current_resources_v1.py \
            sinergy_financial_os/distribution_available_capacity_v2.py \
            sinergy_financial_os/distribution_available_capacity_guard_v2.py \
            sinergy_financial_os/distribution_budget_current_capacity_contract_v2.py
      - name: Run budget/current-capacity regressions
        run: |
          pytest -q \
            tests/test_distribution_budget_current_capacity_v2.py \
            tests/test_distribution_budget_current_capacity_contract_v2.py
