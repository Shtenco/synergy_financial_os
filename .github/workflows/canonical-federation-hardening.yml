name: Canonical federation hardening

on:
  pull_request:
    paths:
      - "sinergy_financial_os/canonical_json.py"
      - "sinergy_financial_os/numeric.py"
      - "sinergy_financial_os/snapshot.py"
      - "sinergy_financial_os/maturity_bridge.py"
      - "sinergy_financial_os/settlement_bridge.py"
      - "sinergy_financial_os/governance.py"
      - "sinergy_financial_os/ai_boundary.py"
      - "sinergy_financial_os/project_bridge.py"
      - "sinergy_financial_os/project_bridge_v2.py"
      - "schemas/financial_snapshot_v2.schema.json"
      - "schemas/maturity_snapshot_v1.schema.json"
      - "schemas/settlement_receipt_v1.schema.json"
      - "schemas/project_proposal_v2.schema.json"
      - "schemas/project_screening_v1.schema.json"
      - "config/schema_registry_v1.json"
      - "config/requirement_registry_v1.json"
      - "config/federation_hardening_matrix_v1.json"
      - "fixtures/conformance/**"
      - "tests/test_canonical_json.py"
      - "tests/test_snapshot_v2.py"
      - "tests/test_snapshot_v2_direct_validation.py"
      - "tests/test_snapshot_v2_conformance_fixture.py"
      - "tests/test_maturity_bridge.py"
      - "tests/test_maturity_v1_conformance_fixture.py"
      - "tests/test_settlement_bridge.py"
      - "tests/test_settlement_v1_conformance_fixture.py"
      - "tests/test_project_bridge_v2.py"
      - "tests/test_project_v2_conformance_fixture.py"
      - "tests/test_registry_integrity.py"
      - "tests/test_governance.py"
      - "tests/test_ai_boundary.py"
      - "tests/test_project_screening_semantics.py"
      - "tests/test_project_screening_schema_shape.py"
      - ".github/workflows/canonical-federation-hardening.yml"
  workflow_dispatch:

concurrency:
  group: canonical-federation-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile hardened modules
        run: >-
          python -m py_compile
          sinergy_financial_os/canonical_json.py
          sinergy_financial_os/numeric.py
          sinergy_financial_os/snapshot.py
          sinergy_financial_os/maturity_bridge.py
          sinergy_financial_os/settlement_bridge.py
          sinergy_financial_os/governance.py
          sinergy_financial_os/ai_boundary.py
          sinergy_financial_os/project_bridge.py
          sinergy_financial_os/project_bridge_v2.py

      - name: Run focused canonical federation tests
        run: >-
          python -m pytest -q
          tests/test_canonical_json.py
          tests/test_snapshot_v2.py
          tests/test_snapshot_v2_direct_validation.py
          tests/test_snapshot_v2_conformance_fixture.py
          tests/test_maturity_bridge.py
          tests/test_maturity_v1_conformance_fixture.py
          tests/test_settlement_bridge.py
          tests/test_settlement_v1_conformance_fixture.py
          tests/test_project_bridge_v2.py
          tests/test_project_v2_conformance_fixture.py
          tests/test_registry_integrity.py
          tests/test_governance.py
          tests/test_ai_boundary.py
          tests/test_project_screening_semantics.py
          tests/test_project_screening_schema_shape.py
