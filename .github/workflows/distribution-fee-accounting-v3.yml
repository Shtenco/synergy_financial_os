name: Distribution Fee Accounting v3

on:
  pull_request:
    paths:
      - 'sinergy_financial_os/distribution_fee_accounting_v3.py'
      - 'schemas/distribution_fee_accounting_decision_v3.schema.json'
      - 'tests/test_distribution_fee_accounting_v3.py'
      - 'config/schema_registry_v28.json'
      - 'docs/DISTRIBUTION_FEE_ACCOUNTING_V3_METAPAY_V3_20260824.md'
      - '.github/workflows/distribution-fee-accounting-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tests
        run: python -m pip install -e . pytest jsonschema
      - name: Compile accounting v3
        run: python -m compileall -q sinergy_financial_os/distribution_fee_accounting_v3.py
      - name: Run accounting v3 regressions
        run: pytest -q tests/test_distribution_fee_accounting_v3.py
