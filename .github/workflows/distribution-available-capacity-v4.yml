name: distribution-available-capacity-v4
on:
  pull_request:
    paths:
      - 'sinergy_financial_os/distribution_available_capacity_v4.py'
      - 'tests/test_distribution_available_capacity_v4.py'
      - 'schemas/distribution_available_capacity_v4.schema.json'
      - 'config/schema_registry_v31.json'
      - 'docs/DISTRIBUTION_AVAILABLE_CAPACITY_V4_REFUND_RESTORED_20260828.md'
      - '.github/workflows/distribution-available-capacity-v4.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest jsonschema
      - run: pytest -q tests/test_distribution_available_capacity_v4.py
