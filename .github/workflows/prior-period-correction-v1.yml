name: prior-period-correction-v1

on:
  push:
    paths:
      - 'sinergy_financial_os/prior_period_correction_v1.py'
      - 'sinergy_financial_os/authorized_prior_period_correction_v1.py'
      - 'schemas/prior_period_correction_authorization_v1.schema.json'
      - 'config/schema_registry_v11.json'
      - 'tests/test_prior_period_correction_v1.py'
      - 'tests/test_prior_period_correction_schema_v1.py'
      - 'docs/PRIOR_PERIOD_EXACT_ENTRY_VOID_V1_20260819.md'
      - '.github/workflows/prior-period-correction-v1.yml'
  pull_request:
    paths:
      - 'sinergy_financial_os/prior_period_correction_v1.py'
      - 'sinergy_financial_os/authorized_prior_period_correction_v1.py'
      - 'schemas/prior_period_correction_authorization_v1.schema.json'
      - 'config/schema_registry_v11.json'
      - 'tests/test_prior_period_correction_v1.py'
      - 'tests/test_prior_period_correction_schema_v1.py'
      - 'docs/PRIOR_PERIOD_EXACT_ENTRY_VOID_V1_20260819.md'
      - '.github/workflows/prior-period-correction-v1.yml'

concurrency:
  group: prior-period-correction-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest jsonschema
      - name: Compile correction modules
        run: |
          python -m py_compile \
            sinergy_financial_os/prior_period_correction_v1.py \
            sinergy_financial_os/authorized_prior_period_correction_v1.py
      - name: Run prior-period correction regressions
        run: |
          pytest -q \
            tests/test_prior_period_correction_v1.py \
            tests/test_prior_period_correction_schema_v1.py
